# Phase 3B: Fujitsu Protocol Integration - LISTEN MODE (hardware wired)
# ESP32 connected as secondary slave on LIN bus via TJA1021/SIT1021T
# UART on GPIO16 (RX) / GPIO17 (TX), 500 baud 8N1
# Goal: capture and decode all bus traffic to build protocol map

esphome:
  name: aircon
  friendly_name: "Aircon"
  project:
    name: "james.retro-fujitsu"
    version: "3B.37"
  on_boot:
    priority: 600
    then:
      - logger.log: "Fujitsu Phase 3B - Listen Mode (hardware wired)"
      - light.turn_on:
          id: status_light
          brightness: 100%
          effect: "Boot Pattern"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Logging: dropped from VERBOSE to DEBUG 11 Aug 2026 (3B.18). VERBOSE compiled in an
# unconditional per-byte ESP_LOGV in FujiHeatPump::readFrame() that fired on every
# single byte of continuous bus traffic (~50/sec) -- a real hot-path cost, same class
# of problem as the earlier crash-loop fix, worth removing regardless -- but it did
# NOT turn out to be the whole story behind the Bus Alive flicker; see
# FujitsuClimate.h's BUS_FRAME_TIMEOUT_MS comment (3B.19) for what happened next.
logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    fujitsu.heatpump: DEBUG
    fujitsu.climate: DEBUG
    uart: WARN

# UART for LIN bus communication via TJA1021/SIT1021T transceiver
# Pull-up on RX pin prevents the floating-pin crash when not wired to bus
uart:
  id: fuji_uart
  tx_pin: GPIO17
  rx_pin:
    number: GPIO16
    mode:
      input: true
      pullup: true   # Critical: prevents RX float -> garbage bytes -> crash when bus disconnected
  baud_rate: 500
  data_bits: 8
  parity: EVEN  # 3B.21: switched from NONE (8N1) to EVEN (8E1) - upstream requires 8E1 for TX, testing whether this unblocks the 3B.20 null TX result
  stop_bits: 1

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Aircon-Fallback"
    password: "fallback123"

  on_connect:
    - logger.log: "WiFi Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Connected"

  on_disconnect:
    - logger.log: "WiFi Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Error"

captive_portal:

# Home Assistant API
api:
  on_client_connected:
    - logger.log: "Home Assistant Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Connected"

  on_client_disconnected:
    - logger.log: "Home Assistant Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Disconnected"

# OTA updates
ota:
  - platform: esphome

# Safe mode: if the device crashes on boot 10 times in a row, it enters a
# minimal mode (WiFi + OTA only) so you can flash a fix without physical access.
safe_mode:
  num_attempts: 10
  reboot_timeout: 10min

# External component - Fujitsu Climate
external_components:
  - source:
      type: local
      path: components
    components: [ fujitsu_climate ]
    refresh: 0s

# Fujitsu Climate Entity
climate:
  - platform: fujitsu_climate
    name: "Fujitsu Heat Pump"
    id: fujitsu_hp
    uart_id: fuji_uart

# Status LED with patterns
light:
  - platform: status_led
    id: status_light
    name: "Status LED"
    pin:
      number: GPIO2
      inverted: false
    effects:
      - strobe:
          name: "Boot Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "WiFi Connected"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 1900ms

      - strobe:
          name: "WiFi Error"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "HA Connected"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 1500ms

      - strobe:
          name: "HA Disconnected"
          colors:
            - state: true
              duration: 300ms
            - state: false
              duration: 700ms

# Web server
web_server:
  port: 80
  version: 3

# Diagnostic sensors
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  - platform: template
    name: "Free Heap Memory"
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    unit_of_measurement: "bytes"
    update_interval: 60s
    entity_category: diagnostic

  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    corrected_setpoint:
      name: "Setpoint"
      id: corrected_setpoint
    corrected_room_temp:
      name: "Room Temp"
      id: corrected_room_temp

# Text sensors
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC Address"

  - platform: version
    name: "ESPHome Version"

  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    bus_status:
      name: "Bus Status"
      id: bus_status
    corrected_mode:
      name: "Mode"
      id: corrected_mode
    corrected_fan_raw:
      name: "Fan"
      id: corrected_fan_raw
    corrected_economy:
      name: "Economy"
      id: corrected_economy
    mystery_bit:
      name: "Mystery Bit"
      id: mystery_bit
    message_dest:
      name: "Message Dest"
      id: message_dest
    message_type:
      name: "Message Type"
      id: message_type
    boot_probe:
      name: "Boot Probe"
      id: boot_probe
    frame_timing:
      name: "Frame Timing"
      id: frame_timing

# Binary sensors
binary_sensor:
  - platform: status
    name: "Status"
    id: system_status

  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    name: "Bus Alive"
    id: bus_alive
    device_class: connectivity
    entity_category: diagnostic

# Switches
switch:
  - platform: restart
    name: "Restart"

# Buttons
button:
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

  # Phase 2 TX test buttons (added 11 Aug 2026, 3B.20) -- deliberately separate from
  # the main climate entity's control() (still read-only, see FujitsuClimate.cpp).
  # Each press sends exactly ONE command frame built from the validated
  # corrected-decode field layout, per plan-to-completion.md Phase 2's required test
  # order: setpoint first (smallest, most reversible change), checked against the
  # physical wall unit after every single press -- not fan/mode/power yet, those come
  # after setpoint is confirmed working (or definitively not).
  - platform: template
    name: "TX Test: Setpoint +1"
    id: tx_test_setpoint_up
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_setpoint_step(1);

  - platform: template
    name: "TX Test: Setpoint -1"
    id: tx_test_setpoint_down
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_setpoint_step(-1);

  # Login handshake test (added 18 Aug 2026, 3B.27) -- sends a burst of 3 pure
  # LOGIN-type frames (no command payload), one per bus cycle. See
  # protocol-review-and-next-experiments.md for why.
  - platform: template
    name: "TX Test: Login Handshake"
    id: tx_test_login_handshake
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_login_handshake();

  # Address-gated LOGIN-ack test (added 18 Aug 2026, continued, 3B.29) -- see
  # protocol-review-and-next-experiments.md's "real mechanism" addendum. Arms a
  # one-shot reply that fires on the next observed messageDest==SECONDARY frame,
  # instead of sending on this button press directly.
  - platform: template
    name: "TX Test: Login Ack (address-gated)"
    id: tx_test_login_ack
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_login_ack();

  # Address-gated STATUS command test (added 18 Aug 2026, continued, 3B.31) -- the
  # actual TX test: a real setpoint change, gated on being addressed, using
  # dest=SECONDARY per the 3B.30 LOGIN-ack result. See
  # protocol-review-and-next-experiments.md for the full reasoning.
  - platform: template
    name: "TX Test: Setpoint +1 (address-gated)"
    id: tx_test_setpoint_gated
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_status_command(1);

  # Minimal-clone command test (added 19 Aug 2026, 3B.36) -- see
  # protocol-review-and-next-experiments.md for the full reasoning: 3B.35's multi-frame
  # capture showed the real controller never changes source/dest/type to command
  # something, only the relevant payload byte. This clones the real frame verbatim and
  # edits only the setpoint byte.
  - platform: template
    name: "TX Test: Setpoint +1 (minimal clone)"
    id: tx_test_setpoint_minimal
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_minimal_setpoint(1);

  # Minimal-clone, own-identity command test (added 19 Aug 2026, 3B.37) -- see
  # protocol-review-and-next-experiments.md. 3B.36 (exact clone incl. source=START)
  # faulted; this keeps dest/messageType untouched (3B.35's finding) but declares our
  # own SECONDARY identity instead of cloning the master's START.
  - platform: template
    name: "TX Test: Setpoint +1 (minimal clone, own source)"
    id: tx_test_setpoint_minimal_own_source
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_minimal_setpoint_own_source(1);

  # Address-gated mode/power command tests (added 19 Aug 2026, 3B.38) -- TX test
  # target pivoted from setpoint to mode/power per James's direction: both are
  # solidly RX-decoded (never wrong/stuck since Session B) and independently
  # checkable via switch.ac, so success/failure is far less ambiguous than setpoint,
  # whose own decode is what garbles during a bad TX collision. Same proven-safe
  # 3B.37 scaffold (own SECONDARY identity, dest/type untouched) -- only the mode/
  # power sub-field of byte[5] is edited. Verify these via switch.ac AND
  # sensor.house_aircon_mode / climate.aircon_fujitsu_heat_pump -- two independent
  # read paths, not just the ESP32's own decode of itself.
  - platform: template
    name: "TX Test: Power On (gated)"
    id: tx_test_power_on
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_power_command(true);

  - platform: template
    name: "TX Test: Power Off (gated)"
    id: tx_test_power_off
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_power_command(false);

  - platform: template
    name: "TX Test: Mode Auto (gated)"
    id: tx_test_mode_auto
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_mode_command(esphome::fujitsu_climate::FujiMode::MODE_AUTO);

  - platform: template
    name: "TX Test: Mode Cool (gated)"
    id: tx_test_mode_cool
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_mode_command(esphome::fujitsu_climate::FujiMode::COOL);

  - platform: template
    name: "TX Test: Mode Dry (gated)"
    id: tx_test_mode_dry
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_mode_command(esphome::fujitsu_climate::FujiMode::DRY);

  - platform: template
    name: "TX Test: Mode Fan (gated)"
    id: tx_test_mode_fan
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_mode_command(esphome::fujitsu_climate::FujiMode::FAN);

  - platform: template
    name: "TX Test: Mode Heat (gated)"
    id: tx_test_mode_heat
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(fujitsu_hp)->test_mode_command(esphome::fujitsu_climate::FujiMode::HEAT);

# Diagnostic interval
interval:
  - interval: 300s
    then:
      - logger.log:
          format: "Status - WiFi: %.0f dBm, Uptime: %.1f hrs, Heap: %d bytes"
          args:
            - 'id(wifi_signal_sensor).state'
            - 'id(uptime_sensor).state / 3600.0'
            - 'heap_caps_get_free_size(MALLOC_CAP_INTERNAL)'

# Time
time:
  - platform: homeassistant
    id: homeassistant_time
