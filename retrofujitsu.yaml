# Phase 4: Vendored-engine rebuild (19 Aug 2026)
# ESP32 connected as a SECONDARY (slave) controller on the Fujitsu LIN bus, via a
# TJA1021/SIT1021T (LIN3TL) transceiver, alongside the existing wired UTY-RNNUM
# controller (which stays in place and remains fully capable of operating the system
# on its own -- see hardware-and-protocol.md's "ESP32 is never the boss" principle).
#
# This version replaces the project's own hand-rolled protocol engine with
# unreality/FujiHeatPump (https://github.com/unreality/FujiHeatPump, MIT licensed),
# vendored into components/fujitsu_climate/FujiHeatPump.{h,cpp}, wrapped in a rebuilt
# ESPHome component modelled on the reference esphome-fujitsu integration -- a
# dedicated FreeRTOS task doing the bus I/O, decoupled from ESPHome's own loop and
# WiFi/API traffic, replying automatically and continuously to every frame addressed
# to us instead of only on a manually-armed test button press. Full reasoning:
# tx-architecture-review-and-adoption-plan.md.
#
# UART on GPIO16 (RX) / GPIO17 (TX), 500 baud 8E1 -- now owned directly by the
# vendored engine via Serial2 (FujiHeatPump::connect()), not ESPHome's uart:
# component; see climate.py's rx_pin/tx_pin config.
#
# Live control (climate.control()) is wired to the real bus. It's gated behind the
# "Aircon Control Enabled" switch below -- per hardware-and-protocol.md's "ESP32 is
# never the boss" principle, that switch (not this default) is what keeps a person
# able to force the system back to read-only from HA or the web UI at any time.
# 20 Aug 2026, at James's explicit request: this now defaults to ON (restore_mode:
# ALWAYS_ON) instead of ALWAYS_OFF -- command adoption was confirmed working the same
# day (state-of-play.md's "4A.1" section) after a locking hardening pass following a
# crash, so this is a considered change, not an oversight. Flip it off in HA/the web
# UI any time you want read-only monitoring (e.g. while testing new firmware).

esphome:
  name: aircon
  friendly_name: "Aircon"
  project:
    name: "james.retro-fujitsu"
    version: "4A.12b-rc1"
  on_boot:
    priority: 600
    then:
      - logger.log: "Fujitsu Phase 4 - vendored engine, continuous secondary-controller reply loop"
      - light.turn_on:
          id: status_light
          brightness: 100%
          effect: "Boot Pattern"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Logging: "fujitsu.heatpump" tag retired -- the vendored FujiHeatPump.cpp is upstream
# code as-is and logs via Serial.printf() (gated by FujiHeatPump::debugPrint, off by
# default -- see FujitsuClimate::setup()) rather than ESPHome's logger, so there's no
# ESP_LOG tag for it to filter on any more. "fujitsu.climate" (this project's own
# wrapper) still uses ESP_LOG normally.
logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    fujitsu.climate: DEBUG

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Aircon-Fallback"
    password: "fallback123"

  on_connect:
    - logger.log: "WiFi Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Connected"

  on_disconnect:
    - logger.log: "WiFi Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Error"

captive_portal:

# Home Assistant API
api:
  on_client_connected:
    - logger.log: "Home Assistant Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Connected"

  on_client_disconnected:
    - logger.log: "Home Assistant Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Disconnected"

# OTA updates
ota:
  - platform: esphome

# Safe mode: if the device crashes on boot 10 times in a row, it enters a
# minimal mode (WiFi + OTA only) so you can flash a fix without physical access.
safe_mode:
  num_attempts: 10
  reboot_timeout: 10min

# External component - Fujitsu Climate
external_components:
  - source:
      type: local
      path: components
    components: [ fujitsu_climate ]
    refresh: 0s

# Fujitsu Climate Entity -- rx_pin/tx_pin replace the old uart_id (see climate.py);
# defaults (16/17) match this project's known wiring, spelled out explicitly here for
# clarity.
climate:
  - platform: fujitsu_climate
    name: "Fujitsu Heat Pump"
    id: fujitsu_hp
    rx_pin: 16
    tx_pin: 17

# Status LED with patterns
light:
  - platform: status_led
    id: status_light
    name: "Status LED"
    internal: true
    pin:
      number: GPIO2
      inverted: false
    effects:
      - strobe:
          name: "Boot Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "WiFi Connected"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 1900ms

      - strobe:
          name: "WiFi Error"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "HA Connected"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 1500ms

      - strobe:
          name: "HA Disconnected"
          colors:
            - state: true
              duration: 300ms
            - state: false
              duration: 700ms

# Web server
web_server:
  port: 80
  version: 2
  log: false

# Diagnostic sensors
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  - platform: template
    name: "Free Heap Memory"
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    unit_of_measurement: "bytes"
    update_interval: 60s
    entity_category: diagnostic

  # Unchanged entity ids from the pre-Phase-4 version, so existing HA history/
  # automations referencing these keep working -- now sourced from the vendored
  # engine's decode instead of the old hand-rolled one.
  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    corrected_setpoint:
      name: "Setpoint"
      id: corrected_setpoint
    corrected_room_temp:
      name: "Room Temp"
      entity_category: ""
      id: corrected_room_temp

# Settable setpoint, independent of the climate entity's own target_temperature.
# 20 Aug 2026 -- added because Home Assistant's own ESPHome climate integration
# unconditionally hides target_temperature whenever the climate entity's hvac_mode is
# "auto" for any device that doesn't support a two-point (low/high) target range --
# see homeassistant/components/esphome/climate.py's target_temperature property. This
# is confirmed live on this device: the ESPHome web UI and the ESP32's own web_server
# REST API both show a real, correct target_temperature in Auto mode (e.g. 18C), but
# Home Assistant's climate.aircon_fujitsu_heat_pump entity reports "temperature": null
# for that exact same value at the exact same moment, purely because of HA's own
# Auto-mode special-casing -- it is not a decode bug in this firmware, and there is no
# firmware-side fix that changes HA's behaviour here (two-point mode doesn't help --
# HA nulls target_temperature_low/high for Auto too). This number entity reads/writes
# the same underlying value via the climate entity's own make_call(), so it is visible
# and settable in HA (and the web UI) in every mode, including Auto.
number:
  - platform: template
    name: "Set Temperature"
    id: fujitsu_set_temperature
    icon: "mdi:thermometer"
    entity_category: diagnostic
    min_value: 16
    max_value: 30
    step: 1
    update_interval: 5s
    lambda: |-
      if (std::isnan(id(fujitsu_hp).target_temperature))
        return {};
      return id(fujitsu_hp).target_temperature;
    set_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_target_temperature(x).perform();

# Settable fan speed, independent of the climate entity's own fan_mode selector.
# 20 Aug 2026 -- added because the ESPHome web UI's climate row only exposes
# Target/Mode, not fan mode (confirmed live: HA's climate card shows a fan-speed
# selector via the climate entity's own supported_fan_modes, but the same control is
# absent from the web UI's rendering of that same entity). This select gives the web
# UI a working, visible fan-speed control mirroring the one HA already has, via the
# same climate make_call() path control() already gates behind "Aircon Control
# Enabled".
select:
  - platform: template
    name: "Fan Speed"
    id: fujitsu_fan_speed
    icon: "mdi:fan"
    update_interval: 5s
    options:
      - "Auto"
      - "Quiet"
      - "Low"
      - "Medium"
      - "High"
    lambda: |-
      if (!id(fujitsu_hp).fan_mode.has_value())
        return {};
      switch (id(fujitsu_hp).fan_mode.value()) {
        case climate::CLIMATE_FAN_AUTO: return std::string("Auto");
        case climate::CLIMATE_FAN_QUIET: return std::string("Quiet");
        case climate::CLIMATE_FAN_LOW: return std::string("Low");
        case climate::CLIMATE_FAN_MEDIUM: return std::string("Medium");
        case climate::CLIMATE_FAN_HIGH: return std::string("High");
        default: return {};
      }
    set_action:
      - lambda: |-
          climate::ClimateFanMode m = climate::CLIMATE_FAN_AUTO;
          if (x == "Quiet") m = climate::CLIMATE_FAN_QUIET;
          else if (x == "Low") m = climate::CLIMATE_FAN_LOW;
          else if (x == "Medium") m = climate::CLIMATE_FAN_MEDIUM;
          else if (x == "High") m = climate::CLIMATE_FAN_HIGH;
          id(fujitsu_hp).make_call().set_fan_mode(m).perform();

  # 17 Oct 2026 (4A.11) -- EXPERIMENTAL: which value of the updateMagic nibble in our STATUS
  # replies can turn the wired controller's Thermo Sensor icon ON (the Write Test switch only
  # turns it OFF). One option at a time; always starts at Off, never restored. Pulse options
  # reset themselves to Off when finished. Start with the icon OFF, pick an option, watch
  # "Thermo Sensor Icon", then set back to Off.
  - platform: template
    name: "Thermo Sensor Experiment"
    id: thermo_experiment
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Off"
    options:
      - "Off"
      - "Pulse x1 (OR 0x8)"
      - "Pulse x5 (OR 0x8)"
      - "Held: nibble = 0x8"
      - "Held: nibble = 0x0"
      - "Held: OR 0x4"
      - "Held: OR 0x1"
    set_action:
      - lambda: 'id(fujitsu_hp)->set_thermo_experiment(x);'

# Text sensors
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC Address"

  - platform: version
    name: "ESPHome Version"

  # Plain-text link to the project repo, visible from both HA and the web UI (see
  # state-of-play.md and hardware-and-protocol.md for the fuller project docs, which
  # live in the project, not the repo). ESPHome's built-in web_server doesn't support
  # a clickable hyperlink here -- this is the URL as text, selectable/copyable in
  # both places. In Home Assistant you can additionally set a card's tap_action to
  # "url" against this entity if you want a one-tap open; that's a dashboard-side
  # change, not a firmware one, so it isn't set here.
  - platform: template
    name: "GitHub Repository"
    icon: "mdi:github"
    entity_category: diagnostic
    lambda: |-
      return std::string("https://github.com/endofthewurst/Retro-Fujitsu-ESPHome");

  # Read-only description of what the Status LED is currently displaying -- added
  # 21 Aug 2026 at James's request. The light entity above is now internal (no
  # switch/effect dropdown exposed to HA or the web UI); this is the replacement --
  # it just reports whichever effect name real conditions (boot/WiFi/HA connection
  # state) have already driven the light to, via LightState::get_effect_name().
  - platform: template
    name: "Status LED Pattern"
    icon: "mdi:led-outline"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(status_light).get_effect_name();

  # Trimmed to bus_status in Phase 4 -- see components/fujitsu_climate/text_sensor.py.
  # 17 Oct 2026 (4A.10): the thermo_sensor / unknown_bit / raw_frame "unconfirmed" sensors
  # were retired (refuted/noisy). Swing was kept and is now "Swing Icon" (see below).
  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    bus_status:
      name: "Bus Status"
      id: bus_status
    # 28 Oct 2026 (4A.12b-rc1) -- renamed from "Swing (unconfirmed)" after a live test against
    # the wired remote's swing icon: HA matches the icon while the unit is running. Known
    # quirk: with the unit off/standby the remote hides the icon but this still reads On.
    # Now a primary entity (Sensors group). See docs/session-5C-entity-layout-2026-10-28.md.
    swing:
      name: "Swing Icon"
      id: swing
    # 4 Oct 2026 (4A.9) -- the two raw frame types, kept separate (see FujiHeatPump.h).
    raw_frame_to_us:
      name: "Raw Frame To Us"
      id: raw_frame_to_us
    raw_frame_other:
      name: "Raw Frame Other"
      id: raw_frame_other
    # 2 Sep 2026 -- requested-vs-actual state sync (plan-to-completion.md). Empty
    # string when in sync; human-readable diff (e.g. "power: requested=on,
    # actual=off") otherwise. out_of_sync_since needs a real time source for its ISO
    # timestamp -- reuses the homeassistant_time already configured below.
    sync_mismatch:
      name: "Sync Mismatch"
      id: sync_mismatch
    out_of_sync_since:
      name: "Out of Sync Since"
      id: out_of_sync_since
      time_id: homeassistant_time
    # 4A.12 -- control-authority attribution (control-authority-attribution.md). Who made
    # the last state change: "HA" | "Human" | "Boot", plus what changed. Not diagnostic.
    last_change_source:
      name: "Last Change Source"
      id: last_change_source
    last_change_detail:
      name: "Last Change Detail"
      id: last_change_detail

# Binary sensors
binary_sensor:
  - platform: status
    name: "Status"
    id: system_status

  # 2 Sep 2026: restructured to a nested schema so a second binary_sensor (In Sync,
  # part of the requested-vs-actual state sync feature -- plan-to-completion.md) could
  # be added alongside Bus Alive. bus_alive keeps its previous device_class/
  # entity_category exactly, now inherited from binary_sensor.py's schema defaults
  # rather than being spelled out here.
  - platform: fujitsu_climate
    fujitsu_climate_id: fujitsu_hp
    bus_alive:
      name: "Bus Alive"
      id: bus_alive
    in_sync:
      name: "In Sync"
      id: aircon_in_sync
    # 4 Oct 2026 (4A.9) -- Thermo Sensor icon, found by a passive button test on 3 Oct
    # (byte 5 bit 7 of the frame addressed to us). On = icon shown on the wired controller.
    # 28 Oct 2026 (4A.12b-rc1): live-confirmed -- HA matches the wired display at all times.
    # Now a primary entity (Sensors group). Read-only; two-way control is a future task.
    thermo_icon:
      name: "Thermo Sensor Icon"
      id: thermo_icon
    # 17 Oct 2026 (4A.10) -- Defrost / Oil Recovery active (byte 2 bit 3 of the frame not
    # addressed to us; matched to the wired controller's icon in a live test). Debounced 3 s.
    defrost_active:
      name: "Defrost Active"
      id: defrost_active

# Switches
switch:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  # Kill switch for live control (added Phase 4) -- hardware-and-protocol.md's "ESP32
  # is never the boss" design principle. climate.control() ignores every HA command
  # unless this is on. 20 Aug 2026, at James's explicit request: restore_mode changed
  # from ALWAYS_OFF to ALWAYS_ON, so live control is armed by default after every
  # boot/OTA/crash rather than requiring it to be flipped on each session. This
  # switch is still the safety override -- flip it off any time (from HA or the web
  # UI) to force the system back to read-only without touching hardware.
  - platform: template
    name: "Aircon Control Enabled"
    id: aircon_control_enabled
    icon: "mdi:lock-open-alert-outline"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: 'id(fujitsu_hp)->set_control_enabled(true);'
    turn_off_action:
      - lambda: 'id(fujitsu_hp)->set_control_enabled(false);'

  # 4 Oct 2026 (4A.9) -- EXPERIMENTAL. Sets byte 5 bit 7 in our replies to test whether
  # the Thermo Sensor bit is writable from the secondary controller. Never restored on.
  - platform: template
    name: "Thermo Sensor Write Test"
    id: thermo_write_test
    icon: "mdi:flask-outline"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(fujitsu_hp)->set_thermo_write_test(true);'
    turn_off_action:
      - lambda: 'id(fujitsu_hp)->set_thermo_write_test(false);'

  # Economy Mode as a standalone switch -- added 21 Aug 2026. climate.preset already
  # supports CLIMATE_PRESET_ECO (confirmed live-adopted, both directions, same day),
  # but neither the web UI nor a plain HA dashboard surfaces a preset control the same
  # way Fan Speed/Set Temperature needed their own entities (20 Aug 2026, same reason:
  # the climate row's own preset control isn't exposed by the web UI). This mirrors
  # that exact pattern via make_call() rather than adding new state anywhere.
  - platform: template
    name: "Economy Mode"
    id: fujitsu_economy_mode
    icon: "mdi:leaf"
    lambda: |-
      return id(fujitsu_hp).preset == climate::CLIMATE_PRESET_ECO;
    turn_on_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_ECO).perform();
    turn_off_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_NONE).perform();

# Buttons
button:
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

# Diagnostic interval
interval:
  # 4A.11 -- lets a finished pulse experiment put the Thermo Sensor Experiment select back to Off.
  - interval: 500ms
    then:
      - lambda: |-
          if (id(fujitsu_hp)->take_thermo_exp_finished()) {
            id(thermo_experiment)->publish_state("Off");
          }
  - interval: 300s
    then:
      - logger.log:
          format: "Status - WiFi: %.0f dBm, Uptime: %.1f hrs, Heap: %d bytes"
          args:
            - 'id(wifi_signal_sensor).state'
            - 'id(uptime_sensor).state / 3600.0'
            - 'heap_caps_get_free_size(MALLOC_CAP_INTERNAL)'

# Time
time:
  - platform: homeassistant
    id: homeassistant_time
